name: Feature request
description: Suggest a capability for Tokser Backup Manager
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, not just the missing button.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backup engine
        - Scheduling
        - Restore
        - Storage backends
        - Telegram / notifications
        - Database backups
        - Security / authentication
        - User interface
        - API
        - Deployment
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the roadmap in README.md
          required: true
        - label: I searched existing issues and discussions
          required: true
