# Tokser Backup Manager — Docker Compose
#
# Quick start:
#   cp .env.example .env          # set TBM_SECRET_KEY and TBM_ENCRYPTION_KEY
#   docker compose up -d
#   open http://localhost:8080
#
# For a PostgreSQL-backed deployment, uncomment the `db` service and set
# TBM_DATABASE_URL in .env.

services:
  tbm:
    build: .
    image: tokserteam/tokser-backup-manager:latest
    container_name: tokser-backup-manager
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8000"
    env_file:
      - .env
    environment:
      TBM_HOST: 0.0.0.0
      TBM_PORT: 8000
      TBM_DATA_DIR: /data
      TBM_BACKUP_DIR: /backups
      TBM_LOG_DIR: /logs
      # Uncomment to use PostgreSQL:
      # TBM_DATABASE_URL: postgresql+psycopg2://tbm:CHANGE_ME@db:5432/tokser
    volumes:
      - tbm-data:/data
      - tbm-logs:/logs
      # Backups must persist outside the container.
      - ./backups:/backups
      # Mount sources read-only; adjust paths to your needs.
      # - /var/www:/sources/var/www:ro
      # - /etc/nginx:/sources/etc/nginx:ro
    # To read root-owned files, add the matching supplementary group:
    # group_add:
    #   - "33"        # www-data on Debian/Ubuntu
    #   - "0"         # root — only if strictly necessary
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # db:
